<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <!-- <link rel="stylesheet" href="../../shared/style.css"> -->
    <link rel="stylesheet" href="../checkout/checkout.css">
</head>
<body>
    <header class="site-header">
        <nav class="main-nav">

            <a href="../../index.html">
                <img
                    src="../../assets/icons/main-icon.png"
                    alt="Chili's Home"
                    class="chilis-logo"
                >
            </a>

            <div class="nav-links">
                <button class="theme-btn" onclick="switchTheme()">
                    Dark Mode
                </button>

                <a href="../../index.html">Home</a>

                <a href="../menu/index.html">
                    <button class="menu-btn" id="menuBtn" type="button">
                    Back to Menu
                    </button>
                </a>
            </div>

        </nav>
    </header>

    <main>
        <section class="order-details">
            <div class="left-column">
                <div class="option">
                    <h1>Order Details</h1>
                </div>
                <div id="details" class="details">
                </div>
            </div>
        </section>

        <section class="contact-info">
            <h1>Contact Info</h1>
            <form>
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname" placeholder="Type here">

                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname" placeholder="Type here">

                <label for="number">Number:</label>
                <input type="text" id="number" name="number" placeholder="Type here">

                <label for="email">Email:</label>
                <input type="text" id="email" name="email" placeholder="Type here">
            </form>
        </section>

        <section class="order-summary">
            <div class="summary">
                <h1>Order Summary</h1>
                <div id="summaryInfo" class="summaryInfo">
                    
                </div>
                <button class="order-btn" id="orderBtn" type="button">
                    Place Order
                </button>
            </div>
        </section>
    </main>

       <!-- Footer -->
<footer class="footer">

        >

            href="https://play.google.com/store/apps/details?id=com.brinker.chilis&pli=1"

        </a>

        </a>

        <a href="https://twitter.com/chilis/" target="_blank">
